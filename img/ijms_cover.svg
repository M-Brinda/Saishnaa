<svg viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-IJMS desc-IJMS">
  <title id="title-IJMS">SSSL International Journal of Medical Science</title>
  <desc id="desc-IJMS">Dark title-oriented journal banner for SSSL International Journal of Medical Science.</desc>
  <defs>
    <linearGradient id="journalBanner7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#884555"/>
      <stop offset="100%" stop-color="#503042"/>
    </linearGradient>
    <pattern id="grid7" width="22" height="22" patternUnits="userSpaceOnUse">
