  <title id="title-IJCE">SSSL International Journal of Civil Engineering</title>
  <desc id="desc-IJCE">Title-oriented website image for SSSL International Journal of Civil Engineering, styled as a modern peer-reviewed open-access journal hero banner.</desc>
