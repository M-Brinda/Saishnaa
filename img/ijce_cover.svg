<svg viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-IJCE desc-IJCE">
  <title id="title-IJCE">SSSL International Journal of Civil Engineering</title>
  <desc id="desc-IJCE">Dark title-oriented journal banner for SSSL International Journal of Civil Engineering.</desc>
  <defs>
    <linearGradient id="journalBanner4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65313d"/>
      <stop offset="100%" stop-color="#3d2d35"/>
    </linearGradient>
    <pattern id="grid4" width="22" height="22" patternUnits="userSpaceOnUse">
