<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-IJME desc-IJME">
  <title id="title-IJME">SSSL International Journal of Mechanical Engineering</title>
  <desc id="desc-IJME">Title-oriented journal banner for SSSL International Journal of Mechanical Engineering, without decorative image panel.</desc>
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#153d8f"/><stop offset="48%" stop-color="#075e73"/><stop offset="100%" stop-color="#102760"/></linearGradient>
    <radialGradient id="glow5" cx="10%" cy="8%" r="68%"><stop offset="0%" stop-color="#8d63ff" stop-opacity="0.58"/><stop offset="100%" stop-color="#000000" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffe76a"/><stop offset="100%" stop-color="#ffc928"/></linearGradient>
    <linearGradient id="cyan5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#17d1d3"/><stop offset="100%" stop-color="#0ba5bd"/></linearGradient>
    <pattern id="grid5" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/></pattern>
    <style>.pill{font-family:'Outfit','Segoe UI',Arial,sans-serif;font-weight:900;font-size:16px;letter-spacing:.2px}.code{font-family:Georgia,'Times New Roman',serif;font-weight:900;font-size:46px;fill:rgba(255,255,255,.72)}.title{font-family:'Outfit','Segoe UI',Arial,sans-serif;font-weight:900;font-size:34px;fill:#fff;letter-spacing:0}.tagline{font-family:'Outfit','Segoe UI',Arial,sans-serif;font-style:italic;font-weight:800;font-size:21px;fill:rgba(255,255,255,.84)}.editor{font-family:'Outfit','Segoe UI',Arial,sans-serif;font-weight:900;font-size:19px;fill:#ffd140}.chip{font-family:'Outfit','Segoe UI',Arial,sans-serif;font-size:14px;font-weight:800;fill:rgba(255,255,255,.92)}.small{font-family:'Poppins','Segoe UI',Arial,sans-serif;font-size:11px;font-weight:800;fill:rgba(255,255,255,.58)}</style>
  </defs>
  <rect width="900" height="400" rx="30" fill="url(#bg5)"/><rect width="900" height="400" rx="30" fill="url(#glow5)"/><rect width="900" height="400" rx="30" fill="url(#grid5)"/>
  <circle cx="32" cy="34" r="5" fill="#fff" opacity=".7"/>
  <g opacity=".16" transform="translate(650 64)"><circle cx="100" cy="108" r="90" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="8 9"/><ellipse cx="100" cy="108" rx="90" ry="31" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="8 9"/><ellipse cx="100" cy="108" rx="32" ry="90" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="8 9"/><path d="M10 108h180M100 18v180" stroke="#fff" stroke-width="1.5" stroke-dasharray="8 9"/><circle cx="100" cy="18" r="5" fill="#fff"/><circle cx="100" cy="198" r="5" fill="#fff"/><circle cx="10" cy="108" r="5" fill="#fff"/><circle cx="190" cy="108" r="5" fill="#fff"/></g>
  <text x="54" y="66" class="code">IJME</text>
  <g transform="translate(394 36)"><rect x="0" y="0" width="205" height="38" rx="19" fill="url(#gold5)"/><text x="102.5" y="25" text-anchor="middle" class="pill" fill="#1d2440">PEER REVIEWED JOURNAL</text><rect x="220" y="0" width="132" height="38" rx="19" fill="url(#cyan5)"/><text x="286" y="25" text-anchor="middle" class="pill" fill="#fff">OPEN ACCESS</text></g>
  <text x="54" y="104" class="title">SSSL International Journal of</text>
  <text x="54" y="140" class="title">Mechanical Engineering</text>
  <text x="54" y="184" class="tagline">Engineering Motion, Force, and Robotics</text><text x="54" y="222" class="editor">Editor-in-Chief: Dr.P.Sivakumar</text>
  <g transform="translate(54 260)"><rect x="0" y="0" width="160" height="48" rx="15" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.20)"/><text x="18" y="30" class="chip">Online ISSN: Pending</text><rect x="176" y="0" width="190" height="48" rx="15" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.20)"/><text x="194" y="30" class="chip">Frequency: 12 Issue per Year</text><rect x="382" y="0" width="136" height="48" rx="15" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.20)"/><text x="406" y="30" class="chip">Peer Reviewed</text></g>
  <g transform="translate(54 330)"><rect x="0" y="0" width="240" height="48" rx="24" fill="url(#gold5)"/><text x="120" y="31" text-anchor="middle" font-family="Outfit,Arial" font-size="16" font-weight="900" fill="#20263f">Submit your manuscripts</text></g>
  <text x="320" y="360" class="small">Mechanical | Manufacturing | Thermal</text>
  
</svg>
