<svg viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-IJAP desc-IJAP">
  <title id="title-IJAP">SSSL International Journal of Applied Physics</title>
  <desc id="desc-IJAP">Dark title-oriented journal banner for SSSL International Journal of Applied Physics.</desc>
  <defs>
    <linearGradient id="journalBanner9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a2f45"/>
      <stop offset="100%" stop-color="#4c2434"/>
    </linearGradient>
    <pattern id="grid9" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .code { font-family: Georgia, 'Times New Roman', serif; font-size: 31px; font-weight: 800; letter-spacing: 0.7px; fill: rgba(255,255,255,0.62); }
      .title { font-family: 'Outfit', 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 800; fill: rgba(255,255,255,0.62); }
      .subject { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: 700; fill: rgba(255,255,255,0.42); }
