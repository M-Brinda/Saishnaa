<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-ml_cover.svg desc-ml_cover.svg">
  <title id="title-ml_cover.svg">Machine Learning IoT topic-oriented journal image</title>
