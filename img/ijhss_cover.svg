<svg viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-IJHSS desc-IJHSS">
  <title id="title-IJHSS">SSSL International Journal of Humanities and Social Science</title>
  <desc id="desc-IJHSS">Dark title-oriented journal banner for SSSL International Journal of Humanities and Social Science.</desc>
  <defs>
    <linearGradient id="journalBanner10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#285f51"/>
      <stop offset="100%" stop-color="#244c72"/>
    </linearGradient>
    <pattern id="grid10" width="22" height="22" patternUnits="userSpaceOnUse">
