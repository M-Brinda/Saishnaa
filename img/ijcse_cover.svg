<svg viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-IJCSE desc-IJCSE">
  <title id="title-IJCSE">SSSL International Journal of Computer Science and Engineering</title>
  <desc id="desc-IJCSE">Dark title-oriented journal banner for SSSL International Journal of Computer Science and Engineering.</desc>
  <defs>
    <linearGradient id="journalBanner1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#263274"/>
      <stop offset="100%" stop-color="#24205c"/>
    </linearGradient>
    <pattern id="grid1" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .code { font-family: Georgia, 'Times New Roman', serif; font-size: 31px; font-weight: 800; letter-spacing: 0.7px; fill: rgba(255,255,255,0.62); }
      .title { font-family: 'Outfit', 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 800; fill: rgba(255,255,255,0.62); }
      .subject { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: 700; fill: rgba(255,255,255,0.42); }
      .meta { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; font-size: 8px; font-weight: 800; fill: rgba(255,255,255,0.28); letter-spacing: 0.4px; }
    </style>
  </defs>
  <rect width="400" height="170" fill="url(#journalBanner1)"/>
  <rect width="400" height="170" fill="url(#grid1)"/>
  <circle cx="355" cy="30" r="73" fill="#ffffff" opacity="0.055"/>
  <circle cx="52" cy="156" r="82" fill="#000000" opacity="0.11"/>
  <rect x="14" y="10" width="372" height="145" rx="19" fill="#ffffff" opacity="0.045"/>
