  <text x="24" y="123" class="subject">Computer Science | Software | AI</text>
  <text x="24" y="145" class="meta">OPEN ACCESS JOURNAL</text>
  <text x="24" y="158" class="meta">VOLUME 1 | ISSUE 1</text>
  <rect x="268" y="72" width="70" height="50" rx="7" fill="none" stroke="#1591a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.56"/><path d="M252 145h105M297 122v22M318 122v22" fill="none" stroke="#1591a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.56"/><path d="M282 91h42M282 104h33" fill="none" stroke="#1591a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.48"/>
