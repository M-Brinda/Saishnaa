<svg viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-IJAES desc-IJAES">
  <title id="title-IJAES">SSSL International Journal of Agriculture and Environmental Science</title>
  <desc id="desc-IJAES">Dark title-oriented journal banner for SSSL International Journal of Agriculture and Environmental Science.</desc>
  <defs>
    <linearGradient id="journalBanner6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#365b5b"/>
      <stop offset="100%" stop-color="#4f596d"/>
    </linearGradient>
    <pattern id="grid6" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .code { font-family: Georgia, 'Times New Roman', serif; font-size: 31px; font-weight: 800; letter-spacing: 0.7px; fill: rgba(255,255,255,0.62); }
      .title { font-family: 'Outfit', 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 800; fill: rgba(255,255,255,0.62); }
      .subject { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: 700; fill: rgba(255,255,255,0.42); }
      .meta { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; font-size: 8px; font-weight: 800; fill: rgba(255,255,255,0.28); letter-spacing: 0.4px; }
    </style>
  </defs>
  <rect width="400" height="170" fill="url(#journalBanner6)"/>
