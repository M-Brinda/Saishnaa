  <rect width="400" height="170" fill="url(#journalBanner12)"/>
  <rect width="400" height="170" fill="url(#grid12)"/>
  <circle cx="355" cy="30" r="73" fill="#ffffff" opacity="0.055"/>
  <circle cx="52" cy="156" r="82" fill="#000000" opacity="0.11"/>
