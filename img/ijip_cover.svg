<svg viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-IJIP desc-IJIP">
  <title id="title-IJIP">International Journal of Innovative Publications</title>
  <desc id="desc-IJIP">Dark title-oriented journal banner for International Journal of Innovative Publications.</desc>
  <defs>
    <linearGradient id="journalBanner12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2b73"/>
      <stop offset="100%" stop-color="#302960"/>
    </linearGradient>
    <pattern id="grid12" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .code { font-family: Georgia, 'Times New Roman', serif; font-size: 31px; font-weight: 800; letter-spacing: 0.7px; fill: rgba(255,255,255,0.62); }
